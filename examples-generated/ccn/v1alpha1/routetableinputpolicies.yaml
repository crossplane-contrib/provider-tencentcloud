apiVersion: ccn.tencentcloud.crossplane.io/v1alpha1
kind: RouteTableInputPolicies
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetableinputpolicies
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    ccnIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    policies:
    - action: accept
      description: desc.
      routeConditions:
      - matchPattern: 1
        name: instance-region
        values:
        - ${var.region}
    routeTableIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: ccn.tencentcloud.crossplane.io/v1alpha1
kind: CCN
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetableinputpolicies
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    bandwidthLimitType: INTER_REGION_LIMIT
    chargeType: PREPAID
    description: desc.
    name: tf-example
    qos: AG
    tags:
      createBy: terraform

---

apiVersion: ccn.tencentcloud.crossplane.io/v1alpha1
kind: Attachment
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetableinputpolicies
  labels:
    testing.upbound.io/example-name: attachment
  name: attachment
spec:
  forProvider:
    ccnIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    instanceId: ${tencentcloud_vpc.vpc.id}
    instanceRegion: ${var.region}
    instanceType: VPC
    routeTableId: ${tencentcloud_ccn_route_table.example.id}

---

apiVersion: ccn.tencentcloud.crossplane.io/v1alpha1
kind: RouteTable
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetableinputpolicies
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    ccnIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: desc.
    name: tf-example

---

apiVersion: vpc.tencentcloud.crossplane.io/v1alpha1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetableinputpolicies
  labels:
    testing.upbound.io/example-name: subnet
  name: subnet
spec:
  forProvider:
    availabilityZone: ${var.availability_zone}
    cidrBlock: 172.16.0.0/24
    isMulticast: false
    name: subnet
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc

---

apiVersion: vpc.tencentcloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetableinputpolicies
  labels:
    testing.upbound.io/example-name: vpc
  name: vpc
spec:
  forProvider:
    cidrBlock: 172.16.0.0/16
    name: vpc
