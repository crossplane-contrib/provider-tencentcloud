apiVersion: ccn.tencentcloud.crossplane.io/v1alpha1
kind: RouteTable
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetable
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    ccnIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: desc.
    name: tf-example

---

apiVersion: ccn.tencentcloud.crossplane.io/v1alpha1
kind: CCN
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetable
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    bandwidthLimitType: INTER_REGION_LIMIT
    chargeType: PREPAID
    description: desc.
    name: tf-example
    qos: AG
    tags:
      createBy: terraform

---

apiVersion: vpc.tencentcloud.crossplane.io/v1alpha1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetable
  labels:
    testing.upbound.io/example-name: subnet
  name: subnet
spec:
  forProvider:
    availabilityZone: ${var.availability_zone}
    cidrBlock: 10.0.20.0/28
    isMulticast: false
    name: subnet
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc

---

apiVersion: vpc.tencentcloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: ccn/v1alpha1/routetable
  labels:
    testing.upbound.io/example-name: vpc
  name: vpc
spec:
  forProvider:
    cidrBlock: 172.16.0.0/16
    name: vpc
