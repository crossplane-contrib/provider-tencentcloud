apiVersion: cls.tencentcloud.crossplane.io/v1alpha1
kind: Config
metadata:
  annotations:
    meta.upbound.io/example-id: cls/v1alpha1/config
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    excludePaths:
    - type: Path
      value: /data
    - type: File
      value: /file
    extractRule:
    - backtracking: 0
      filterKeyRegex:
      - key: key1
        regex: value1
      - key: key2
        regex: value2
      - key: ErrorCode
        regex: "500"
      isGbk: 0
      jsonStandard: 1
      metaTags:
      - key: myKey
        value: myValue
      metadataType: 2
      unMatchLogKey: LogParseFailure
      unMatchUpLoadSwitch: true
    inputType: file
    logType: json_log
    name: tf-example
    output: 734f50d1-d621-425c-8768-6f9a5f0412ee
    path: /data/log/**/error.log
