apiVersion: cls.tencentcloud.crossplane.io/v1alpha1
kind: Index
metadata:
  annotations:
    meta.upbound.io/example-id: cls/v1alpha1/index
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    includeInternalFields: true
    metadataFlag: 1
    rule:
    - dynamicIndex:
      - status: true
      fullText:
      - caseSensitive: true
        containZH: true
        tokenizer: ${local.tokenizer_value}
      keyValue:
      - caseSensitive: true
        keyValues:
        - key: key1
          value:
          - alias: alias1
            containZH: true
            sqlFlag: true
            tokenizer: ${local.tokenizer_value}
            type: text
        - key: key2
          value:
          - alias: alias2
            childNode:
            - key: key3
              value:
              - alias: alias3
                childNode:
                - key: key4
                  value:
                  - alias: alias4
                    containZH: true
                    sqlFlag: true
                    tokenizer: ${local.tokenizer_value}
                    type: text
                - key: key5
                  value:
                  - alias: name5
                    containZH: true
                    sqlFlag: true
                    tokenizer: ${local.tokenizer_value}
                    type: text
                containZH: true
                sqlFlag: true
                tokenizer: ${local.tokenizer_value}
                type: json
            - key: key6
              value:
              - alias: name6
                containZH: true
                sqlFlag: true
                tokenizer: ${local.tokenizer_value}
                type: text
            containZH: true
            sqlFlag: true
            tokenizer: ${local.tokenizer_value}
            type: json
      tag:
      - caseSensitive: true
        keyValues:
        - key: terraform
          value:
          - containZH: true
            sqlFlag: true
            tokenizer: ${local.tokenizer_value}
            type: text
    status: true
    topicIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: cls.tencentcloud.crossplane.io/v1alpha1
kind: Logset
metadata:
  annotations:
    meta.upbound.io/example-id: cls/v1alpha1/index
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    logsetName: tf_example
    tags:
      demo: test

---

apiVersion: cls.tencentcloud.crossplane.io/v1alpha1
kind: Topic
metadata:
  annotations:
    meta.upbound.io/example-id: cls/v1alpha1/index
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    autoSplit: false
    describes: Test Demo.
    hotPeriod: 10
    logsetIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    maxSplitPartitions: 20
    partitionCount: 1
    period: 30
    storageType: hot
    tags:
      test: test
    topicName: tf_example
