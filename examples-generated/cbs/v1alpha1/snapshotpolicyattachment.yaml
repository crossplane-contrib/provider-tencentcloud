apiVersion: cbs.tencentcloud.crossplane.io/v1alpha1
kind: SnapshotPolicyAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: cbs/v1alpha1/snapshotpolicyattachment
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    snapshotPolicyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    storageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: cbs.tencentcloud.crossplane.io/v1alpha1
kind: SnapshotPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: cbs/v1alpha1/snapshotpolicyattachment
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    repeatHours:
    - 1
    repeatWeekdays:
    - 1
    - 4
    retentionDays: 7
    snapshotPolicyName: tf-example

---

apiVersion: cbs.tencentcloud.crossplane.io/v1alpha1
kind: Storage
metadata:
  annotations:
    meta.upbound.io/example-id: cbs/v1alpha1/snapshotpolicyattachment
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    availabilityZone: ap-guangzhou-6
    encrypt: false
    projectId: 0
    storageName: tf-example
    storageSize: 60
    storageType: CLOUD_SSD
    tags:
      createBy: Terraform
