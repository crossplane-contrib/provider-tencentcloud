      - hosts:
        - 192.168.2.42 static.fake.com
        - 192.168.2.42 static.fake.com2
        kernelArgs:
        - kernel.pid_max=65535
        - fs.file-max=400000
        nameservers:
        - 183.60.83.19
        - 183.60.82.98
      replicas: 2
      runtimeRootDir: /var/lib/docker
      scaling:
      - createPolicy: ZoneEquality
        maxReplicas: 10
        minReplicas: 1
      securityGroupIds:
      - sg-7tum9120
      subnetIds:
      - subnet-itb6d123
      systemDisk:
      - diskSize: 50
        diskType: CLOUD_SSD
    tags:
    - resourceType: machine
      tags:
      - key: keep-test-np1
        value: test1
      - key: keep-test-np3
        value: test3
    taints:
    - effect: NoExecute
      key: product
      value: coderider
    type: Native
    unschedulable: false
