apiVersion: tke.tencentcloud.crossplane.io/v1alpha1
kind: NativeNodePool
metadata:
  annotations:
    meta.upbound.io/example-id: tke/v1alpha1/nativenodepool
  labels:
    testing.upbound.io/example-name: kubernetes_native_node_pool
  name: kubernetes-native-node-pool
spec:
  forProvider:
    annotations:
    - name: node.tke.cloud.tencent.com/test-anno
      value: test
    - name: node.tke.cloud.tencent.com/test-label
      value: test
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    deletionProtection: false
    labels:
    - name: test11
      value: test21
    name: native-node-pool
    native:
    - autoRepair: false
      dataDisks:
      - autoFormatAndMount: true
