apiVersion: mongodb.tencentcloud.crossplane.io/v1alpha1
kind: StandbyInstance
metadata:
  annotations:
    meta.upbound.io/example-id: mongodb/v1alpha1/standbyinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    availableZone: ap-guangzhou-7
    cpu: 2
    dataEncryption: TDE
    encryptionKeySource: manual
    fatherInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    fatherInstanceRegion: ap-guangzhou
    instanceName: tf-example
    keyId: KMS-MONGODB
    kmsRegion: ap-guangzhou
    memory: 4
    projectId: 0
    subnetId: subnet-d4umunpy
    tags:
      createBy: Terraform
    volume: 100
    vpcId: vpc-i5yyodl9

---

apiVersion: mongodb.tencentcloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: mongodb/v1alpha1/standbyinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    availableZone: ap-guangzhou-6
    cpu: 2
    dataEncryption: TDE
    encryptionKeySource: manual
    engineVersion: MONGO_80_WT
    instanceName: tf-example
    keyId: KMS-MONGODB
    kmsRegion: ap-guangzhou
    machineType: GE.LD.T1
    memory: 4
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    projectId: 0
    subnetIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    volume: 100
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
