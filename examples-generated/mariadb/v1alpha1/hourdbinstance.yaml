apiVersion: mariadb.tencentcloud.crossplane.io/v1alpha1
kind: HourDBInstance
metadata:
  annotations:
    meta.upbound.io/example-id: mariadb/v1alpha1/hourdbinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    instanceName: tf-example
    memory: 4
    nodeCount: 2
    storage: 100
    subnetIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tags:
      createdBy: Terraform
    vip: 10.0.0.8
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    zones:
    - ap-guangzhou-6
    - ap-guangzhou-7
